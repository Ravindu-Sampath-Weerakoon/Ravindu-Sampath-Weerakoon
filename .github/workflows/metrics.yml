name: Metrics
on:
  # Schedule updates (Changed to once a day at midnight to reduce rate-limiting risk)
  schedule: [{cron: "0 0 * * *"}]
  # Allows you to run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: Ravindu-Sampath-Weerakoon
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          
          # --- FAILURE HANDLING & ANTI-EMAIL SETTINGS ---
          # Uses action's internal automated account to commit, minimizing notification triggers
          committer_bypass: ${{ secrets.GITHUB_TOKEN }}
          # Prevents the workflow from completely crashing if a secondary plugin fails
          plugins_errors_fatal: no
          # Adds a built-in delay between heavy API calls to avoid rate limits
          config_order: header, activity, community, repositories, metadata, languages, habits
          retries: 3
          delay: 30
          
          # Plugin: Languages
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          
          # Plugin: Habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Plugin: Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
