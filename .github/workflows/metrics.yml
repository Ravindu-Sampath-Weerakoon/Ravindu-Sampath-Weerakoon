name: Metrics
on:
  # Schedule updates once a day at midnight (reducing API rate-limiting risk)
  schedule: [{cron: "0 0 * * *"}]
  # Allows manually running the workflow from the Actions tab
  workflow_dispatch:
  # Triggers when code is pushed to main branches
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token (Make sure it is a Classic token with repo, read:user, and read:org scopes)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: Ravindu-Sampath-Weerakoon
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          
          # --- ERROR & ANTI-FAILURE TUNING ---
          # If a single plugin hits a rate limit or errors out, keep the workflow green anyway
          plugins_errors_fatal: no
          # Space out the data gathering order to ensure reliable loading
          config_order: header, activity, community, repositories, metadata, languages, habits
          # Retry up to 3 times if GitHub's API hiccups, waiting 30 seconds between tries
          retries: 3
          retries_delay: 30
          
          # Plugin: Languages
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          
          # Plugin: Habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Plugin: Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
