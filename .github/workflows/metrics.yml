name: Metrics
on:
  schedule:
    # Runs once a day at midnight (reducing API rate-limiting risk)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Speeds up indepth language calculation by providing local repository contexts
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Detailed Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Core Configuration
          user: Ravindu-Sampath-Weerakoon
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          
          # --- PERFORMANCE & RATE LIMIT DEFENSE ---
          plugins_errors_fatal: no
          config_order: header, activity, community, repositories, metadata, languages, habits
          retries: 3
          retries_delay: 30
          # Skips checking images that aren't needed, saving execution time
          config_twemoji: no
          config_gemoji: no
          
          # --- OPTIMIZED PLUGINS ---
          # Plugin: Languages
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          # Prevents huge codebases from stalling the action run
          plugin_languages_analysis_timeout: 15
          
          # Plugin: Habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          
          # Plugin: Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
